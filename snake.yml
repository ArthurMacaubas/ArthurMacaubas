name: Gerar cobrinha

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#C9A227&color_dots=#2a2a2a,#5c4a16,#8a6e1f,#b08d24,#C9A227
            dist/snake-dark.svg?palette=github-dark&color_snake=#C9A227&color_dots=#161b22,#3A2E0B,#6b5518,#a3841f,#C9A227

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
